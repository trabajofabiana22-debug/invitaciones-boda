<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<base href="../coleccion/">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invitaciones de boda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500&family=Pinyon+Script&family=Great+Vibes&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#efe6d8; --tinta:#5e4826; --oro:#a8843f; --suave:#7d6a4f; --boton:#a8843f; --boton-txt:#fffaf0;
  --script:'Pinyon Script',cursive; --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:light; } }
:root[data-theme="dark"]{ color-scheme:light; }
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--fondo);color:var(--tinta);font-family:var(--serif);-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .6s}
body.cerrado{overflow:hidden}
main{max-width:480px;margin:0 auto;box-shadow:0 0 60px rgba(40,25,10,.22);background:var(--fondo)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- cada pantalla ---------- */
.lienzo{position:relative;aspect-ratio:768/1376;container-type:inline-size;overflow:hidden}
.capa{position:absolute;inset:0;transition:transform 1.8s cubic-bezier(.2,.7,.2,1),opacity 1.4s ease}
.visto .capa{animation:respira 16s ease-in-out 1.8s infinite alternate}
@keyframes respira{to{transform:scale(1.035)}}
.visto.acerca .capa{animation:acerca 14s ease-in-out 1.8s infinite alternate}
@keyframes acerca{to{transform:scale(1.13)}}
.oculto .capa{transform:scale(1.08);opacity:0}
.capa img.fondo{position:absolute;inset:0;width:100%;height:100%;display:block}
.lienzo::after{content:"";position:absolute;inset:-20% -60%;pointer-events:none;z-index:3;
  background:linear-gradient(105deg,transparent 42%,rgba(255,248,225,.5) 50%,transparent 58%);transform:translateX(-70%);opacity:0}
.visto::after{animation:barrido 2.6s ease .6s 1}
@keyframes barrido{0%{transform:translateX(-70%);opacity:1}100%{transform:translateX(70%);opacity:1}}
.brillo{position:absolute;z-index:2;width:2.2cqw;aspect-ratio:1;pointer-events:none;
  background:radial-gradient(circle,#fff 0,rgba(255,240,200,.85) 30%,transparent 70%);animation:titila 3.2s ease-in-out infinite;opacity:0}
@keyframes titila{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.polvo{position:absolute;z-index:2;bottom:-3%;width:1cqw;aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,246,214,1),rgba(255,230,170,0) 70%);animation:sube linear infinite;opacity:0}
@keyframes sube{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-105cqw) translateX(4cqw);opacity:0}}

/* ---------- partes de la imagen que se mueven (mariposas, carruaje, flores) ---------- */
.pieza{position:absolute;background-repeat:no-repeat;pointer-events:none;will-change:transform;
  -webkit-mask:radial-gradient(closest-side,#000 72%,transparent);mask:radial-gradient(closest-side,#000 72%,transparent)}
.pieza.mari{animation:aletea var(--d,2.6s) ease-in-out var(--r,0s) infinite,posa 9s ease-in-out var(--r,0s) infinite alternate}
@keyframes aletea{0%,25%,100%{scale:1 1}50%{scale:.55 1}75%{scale:1 1}}
@keyframes posa{to{translate:.5cqw -.7cqw}}
.pieza.mece{transform-origin:50% 100%;animation:mece 4.5s ease-in-out var(--r,0s) infinite alternate;
  -webkit-mask:radial-gradient(closest-side,#000 82%,transparent);mask:radial-gradient(closest-side,#000 82%,transparent)}
@keyframes mece{from{rotate:-.9deg}to{rotate:.9deg}}
.pieza.carro{transform-origin:50% 92%;animation:carro 3.2s ease-in-out infinite alternate;
  -webkit-mask:radial-gradient(closest-side,#000 86%,transparent);mask:radial-gradient(closest-side,#000 86%,transparent)}
@keyframes carro{from{translate:-.5cqw 0;rotate:-.35deg}to{translate:.5cqw -.5cqw;rotate:.35deg}}
.pieza.llama{animation:llama 1.7s ease-in-out var(--r,0s) infinite alternate}
@keyframes llama{0%{filter:brightness(1)}40%{filter:brightness(1.18)}70%{filter:brightness(1.05)}100%{filter:brightness(1.25)}}
/* mariposas dibujadas que cruzan volando */
.vuela{position:absolute;z-index:2;left:0;width:6.5cqw;pointer-events:none;animation:ruta var(--t,11s) linear forwards}
.vuela.izq{animation-name:ruta2}
.vuela svg{display:block;width:100%;rotate:var(--g,78deg);animation:ala .6s ease-in-out infinite alternate;filter:drop-shadow(0 .4cqw .5cqw rgba(60,30,40,.18))}
@keyframes ala{to{transform:scaleX(.45)}}
@keyframes ruta{0%{translate:-10cqw 0;opacity:0}8%{opacity:1}22%{translate:18cqw -9cqw}40%{translate:38cqw 3cqw}58%{translate:58cqw -12cqw}76%{translate:80cqw -2cqw}92%{opacity:1}100%{translate:112cqw -14cqw;opacity:0}}
@keyframes ruta2{0%{translate:104cqw 0;opacity:0}8%{opacity:1}24%{translate:78cqw -10cqw}44%{translate:55cqw 2cqw}62%{translate:34cqw -11cqw}80%{translate:14cqw -3cqw}92%{opacity:1}100%{translate:-12cqw -15cqw;opacity:0}}

/* ---------- textos sobre la imagen ---------- */
.t{position:absolute;z-index:1;display:flex;align-items:center;justify-content:center;text-align:center;--e:1}
.t .in{display:flex;flex-direction:column;align-items:center;gap:calc(1.4cqw*var(--e));max-width:100%}
.t.panel .in{background:rgba(255,251,244,.8);border-radius:3cqw;padding:3cqw 4cqw;box-shadow:0 0 6cqw 3cqw rgba(255,251,244,.5)}
.oscuro .t.panel .in{background:rgba(10,20,25,.55);box-shadow:0 0 6cqw 3cqw rgba(10,20,25,.4)}
.eti{font-family:var(--sans);font-weight:500;letter-spacing:.3em;text-transform:uppercase;font-size:calc(2.7cqw*var(--e));color:var(--oro)}
.nombre{font-family:var(--script);font-size:calc(13cqw*var(--e));line-height:1.05;color:var(--tinta);padding:0 2cqw}
.y{font-family:var(--script);font-size:calc(8cqw*var(--e));line-height:.8;color:var(--oro)}
.titulo{font-family:var(--script);font-size:calc(10.5cqw*var(--e));line-height:1.05;color:var(--tinta);padding:0 1.5cqw}
.frase{font-style:italic;font-size:calc(4.6cqw*var(--e));line-height:1.4;color:var(--suave);white-space:pre-line}
.fecha{font-family:var(--sans);letter-spacing:.16em;text-transform:uppercase;font-size:calc(3cqw*var(--e));color:var(--tinta);line-height:1.6}
.grande{font-weight:600;font-size:calc(5.8cqw*var(--e));line-height:1.15;color:var(--tinta)}
.chico{font-style:italic;font-size:calc(4cqw*var(--e));line-height:1.3;color:var(--suave);white-space:pre-line}
.rotulo{font-family:var(--sans);font-weight:500;letter-spacing:.2em;text-transform:uppercase;font-size:calc(2.5cqw*var(--e));color:var(--oro)}
.dato{font-weight:600;font-size:calc(4.2cqw*var(--e));color:var(--tinta);word-break:break-all}
.linea{width:24cqw;height:1px;background:linear-gradient(90deg,transparent,var(--oro),transparent);flex:none}
.adorno{width:calc(7cqw*var(--e));height:calc(7cqw*var(--e));color:var(--oro)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:calc(.6cqw*var(--e)) calc(1.4cqw*var(--e));font-family:var(--sans);font-size:calc(2.9cqw*var(--e));color:var(--tinta)}
.cal b{font-weight:500;color:var(--oro);font-size:.85em}
.cal span{width:calc(5.4cqw*var(--e));aspect-ratio:1;display:grid;place-items:center}
.cal .hoy{background:var(--boton);color:var(--boton-txt);border-radius:50%;box-shadow:0 0 0 1cqw color-mix(in srgb,var(--boton) 25%,transparent);animation:late2 2s ease-in-out infinite}
@keyframes late2{50%{transform:scale(1.15)}}
.agenda{display:flex;flex-direction:column;gap:calc(1.8cqw*var(--e))}
.agenda div{display:grid;grid-template-columns:calc(14cqw*var(--e)) auto;gap:calc(3cqw*var(--e));align-items:center;text-align:left}
.agenda .h{font-family:var(--sans);font-weight:500;font-size:calc(3.3cqw*var(--e));color:var(--oro);text-align:right;border-right:1px solid var(--oro);padding-right:calc(3cqw*var(--e))}
.agenda .q{font-weight:600;font-size:calc(4.6cqw*var(--e))}
.fila{display:flex;gap:calc(2cqw*var(--e))}
.fila div{display:flex;flex-direction:column;align-items:center;min-width:calc(12cqw*var(--e));padding:calc(1.5cqw*var(--e)) 0;border:1px solid color-mix(in srgb,var(--oro) 60%,transparent);border-radius:2cqw;background:color-mix(in srgb,var(--fondo) 55%,transparent)}
.num{font-weight:500;font-size:calc(6.4cqw*var(--e));line-height:1;color:var(--tinta)}
.uni{font-family:var(--sans);font-size:calc(1.9cqw*var(--e));letter-spacing:.14em;text-transform:uppercase;color:var(--oro);margin-top:.6cqw}
.caja{position:absolute;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.caja .num{font-size:6.6cqw}.caja .uni{font-size:1.9cqw}
.pil{position:absolute;z-index:1;display:flex;align-items:center;justify-content:center;gap:1.6cqw;border-radius:99px;font-family:var(--sans);font-weight:500;
  font-size:2.9cqw;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta);text-decoration:none;white-space:nowrap;transition:transform .2s}
.pil:active,.boton:active{transform:scale(.95)}
.pil svg,.boton svg{width:1.5em;height:1.5em;flex:none}
.boton{display:inline-flex;align-items:center;gap:1.4cqw;margin-top:calc(1cqw*var(--e));padding:calc(1.8cqw*var(--e)) calc(5cqw*var(--e));border-radius:99px;background:var(--boton);color:var(--boton-txt);
  font-family:var(--sans);font-weight:500;font-size:calc(2.8cqw*var(--e));letter-spacing:.12em;text-transform:uppercase;text-decoration:none;white-space:nowrap;box-shadow:0 1cqw 3cqw rgba(40,30,15,.22);transition:transform .2s}
.linea-txt{position:absolute;z-index:1;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;font-size:3.8cqw;color:var(--tinta);white-space:nowrap;overflow:hidden}
.linea-txt.tit{font-family:var(--script);font-weight:400;font-size:9cqw}
.clara{color:#fffaf0!important}.osc{color:#3a2a22!important}
.foto{position:absolute;z-index:1;overflow:hidden;display:flex;align-items:center;justify-content:center;background:rgba(255,252,246,.35)}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto img.real{object-position:var(--x,50%) var(--y,30%);transform:scale(var(--z,1));transform-origin:var(--x,50%) var(--y,30%)}
.foto img.borroso{position:absolute;inset:0;object-position:50% 50%;filter:blur(8px) brightness(1.05);transform:scale(1.2);opacity:.85}
.foto img.real{position:relative;cursor:zoom-in}
.capa.limpia{background:radial-gradient(ellipse at 50% 45%,color-mix(in srgb,var(--fondo) 55%,#fff),var(--fondo) 75%)}
.capa.limpia::before,.capa.limpia::after{content:"";position:absolute;pointer-events:none;border:1px solid color-mix(in srgb,var(--oro) 75%,transparent);border-radius:2cqw}
.capa.limpia::before{inset:4cqw}.capa.limpia::after{inset:5.4cqw;opacity:.55}
.foto.grande{border-radius:2.5cqw;box-shadow:0 0 0 .7cqw color-mix(in srgb,var(--oro) 85%,#fff),0 0 0 1.6cqw rgba(255,250,240,.55),0 3cqw 7cqw rgba(30,10,10,.45)}
.foto.grande img.real{object-fit:contain}
#verfoto{position:fixed;inset:0;z-index:80;background:rgba(20,15,10,.92);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#verfoto[hidden]{display:none}
#verfoto img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#verfoto span{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#fff;font-family:var(--sans);font-size:13px;opacity:.8}
.ajuste{display:none;margin:-4px 0 12px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.04);font-size:13px}
.ajuste.si{display:block}
.ajuste .quitar{margin-top:6px;padding:6px 14px;border:1px solid #b9a; border-radius:99px;font-size:13px;color:#8a3b3b;background:#fff}
.ajuste label{display:flex;align-items:center;gap:8px;margin:4px 0}
.ajuste label span{flex:0 0 120px}
.ajuste input{flex:1;width:auto}
.foto:has(.vacia){outline:1px dashed color-mix(in srgb,var(--oro) 70%,transparent);outline-offset:-1px}
.foto .vacia{font-style:italic;font-size:3.8cqw;color:var(--suave);padding:3cqw;text-align:center}
.oval{border-radius:50%}.redondo{border-radius:4cqw}.arco{border-radius:50% 50% 2cqw 2cqw/38% 38% 2cqw 2cqw}

/* aparición: cada renglón entra de a uno; los nombres se "escriben" */
.t .in>*{transition:opacity 1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1),filter 1s ease,clip-path 1.8s ease;transition-delay:calc(.45s + var(--i)*.32s)}
.t .in>.nombre,.t .in>.titulo{clip-path:inset(-20% -5% -20% -5%)}
.pil,.caja,.foto,.linea-txt{transition:opacity 1.2s ease 1.2s,transform 1.2s ease 1.2s}
.oculto .foto{opacity:0;transform:scale(.92)}

.cierre{padding:34px 24px 96px;text-align:center;border-top:1px solid color-mix(in srgb,var(--oro) 40%,transparent)}
.cierre .nombre{font-size:44px}
.cierre p{font-style:italic;font-size:19px;color:var(--suave);margin-top:6px}

/* ---------- portada ---------- */
#portada{position:fixed;inset:0;z-index:50;background:#1d1812;transition:opacity 1.2s ease}
#portada.fuera{opacity:0;pointer-events:none}
.marco{position:absolute;inset:0;margin:0 auto;width:min(100vw,480px);overflow:hidden;container-type:size}
.escena{position:absolute;left:50%;top:50%;width:max(100cqw,calc(100cqh*768/1376));aspect-ratio:768/1376;translate:-50% -50%;container-type:inline-size;transition:transform 3.2s cubic-bezier(.5,0,.2,1)}
.zoom .escena{transform:scale(1.35)}
.escena img{position:absolute;inset:0;width:100%;height:100%}
.escena img.cuadro{opacity:0;transform:scale(1.04);transition:opacity 1.1s ease,transform 3s cubic-bezier(.2,.7,.2,1)}
.escena img.cuadro.ver{opacity:1;transform:scale(1)}
.destello{position:absolute;z-index:4;left:50%;width:30cqw;aspect-ratio:1;translate:-50% -50%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,250,232,1) 0,rgba(255,232,170,.75) 30%,rgba(255,225,160,0) 70%);animation:estalla 1.6s ease-out forwards}
@keyframes estalla{0%{opacity:0;transform:scale(.2)}25%{opacity:1}100%{opacity:0;transform:scale(7)}}
.blanco{position:absolute;inset:0;z-index:5;background:#fffaf0;opacity:0;pointer-events:none;transition:opacity 1.1s ease}
.final .blanco{opacity:1}
.latido{position:absolute;z-index:3;left:50%;width:36cqw;aspect-ratio:1;translate:-50% -50%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,246,215,.6),transparent 65%);animation:late 2.2s ease-in-out infinite}
.abriendo .latido{display:none}
@keyframes late{0%,100%{transform:scale(.8);opacity:.3}50%{transform:scale(1.15);opacity:1}}
.cartel{position:absolute;z-index:6;left:50%;translate:-50% 0;padding:10px 20px;border-radius:99px;background:rgba(35,28,18,.72);color:#fbf3e2;
  text-align:center;white-space:nowrap;backdrop-filter:blur(4px);transition:opacity .6s}
.cartel.arriba{top:max(22px,env(safe-area-inset-top));font-style:italic;font-size:21px}
.cartel.abajo{bottom:max(26px,env(safe-area-inset-bottom));font-family:var(--sans);font-size:12px;letter-spacing:.22em;text-transform:uppercase;animation:flota 2.2s ease-in-out infinite}
@keyframes flota{50%{translate:-50% -5px}}
.abriendo .cartel{opacity:0}
#abrir{position:absolute;inset:0;z-index:7;width:100%;height:100%}

/* ---------- pétalos ---------- */
#petalos{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.petalo{position:absolute;top:-6vh;border-radius:150% 0 150% 0;opacity:.9;animation:cae linear forwards;will-change:transform}
@keyframes cae{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(var(--v),27vh) rotate(90deg)}50%{transform:translate(calc(var(--v)*-1),55vh) rotate(180deg)}
  75%{transform:translate(var(--v),82vh) rotate(270deg)}100%{transform:translate(0,112vh) rotate(360deg)}}

/* ---------- música y editor ---------- */
.flotante{position:fixed;z-index:45;bottom:max(16px,env(safe-area-inset-bottom));width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,251,242,.94);color:#5e4826;box-shadow:0 4px 16px rgba(40,30,15,.25);border:1px solid rgba(168,132,63,.5)}
.flotante svg{width:22px;height:22px}
#musica{right:max(16px,calc(50vw - 224px))}
#editar{left:max(16px,calc(50vw - 224px));width:auto;padding:0 16px;border-radius:99px;gap:8px;display:flex;align-items:center;font-family:var(--sans);font-size:13px;letter-spacing:.08em}
#musica.sonando svg{animation:gira 4s linear infinite}
@keyframes gira{to{rotate:360deg}}
#hoja{position:fixed;z-index:60;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;max-height:84vh;overflow:auto;background:#fffdf8;color:#3d3326;
  border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);padding:18px 18px 28px;transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);font-family:var(--sans)}
#hoja.abierta{transform:none}
#hoja h2{font-family:var(--serif);font-weight:600;font-size:24px;margin-bottom:2px}
#hoja .ayuda{font-size:13px;color:#7a6c58;margin-bottom:14px;line-height:1.45}
.disenos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.disenos button{border:2px solid #e6dccb;border-radius:12px;overflow:hidden;text-align:center;font-size:12px;line-height:1.2;padding-bottom:6px;background:#fff}
.disenos button[aria-pressed="true"]{border-color:#a8843f;box-shadow:0 0 0 2px rgba(168,132,63,.25)}
.disenos img{width:100%;aspect-ratio:1/1.1;object-fit:cover;display:block;margin-bottom:5px}
.campos{display:grid;gap:10px}
.campos label{display:grid;gap:4px;font-size:12px;letter-spacing:.05em;color:#7a6c58}
.campos input,.campos textarea,.campos select{font:16px var(--sans);padding:10px 12px;border:1px solid #ddd2bf;border-radius:10px;background:#fff;color:#3d3326;width:100%}
.campos textarea{min-height:70px;resize:vertical}
.campos .par{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grupo{font-family:var(--serif);font-size:18px;font-weight:600;margin-top:8px;color:#a8843f}
.acciones{display:flex;gap:10px;margin-top:16px;position:sticky;bottom:-28px;background:#fffdf8;padding:10px 0 4px}
.acciones button{flex:1;padding:12px;border-radius:12px;background:#a8843f;color:#fff;font-size:14px}
.acciones.compartir{position:static;margin-top:0;padding-top:0}
.acciones.compartir button{background:#25a35a}
body.invitado #editar{display:none!important}
.acciones button.sec{background:#f1eadc;color:#5e4826}
#aviso{position:fixed;z-index:70;left:50%;bottom:90px;translate:-50% 20px;opacity:0;background:#2b2418;color:#fff;padding:10px 18px;border-radius:99px;font-family:var(--sans);font-size:14px;transition:.3s;pointer-events:none}
#aviso.ver{opacity:1;translate:-50% 0}
@media (prefers-reduced-motion: reduce){
  .capa,.escena,.escena *,.t .in>*{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}
  .latido,.brillo,.polvo,.cartel.abajo,.pieza{animation:none!important}
  .vuela{display:none}
  #petalos{display:none}
}
</style>
</head>
<body class="cerrado">

<div id="portada">
  <div class="marco"><div class="escena" id="escena">
    <div id="cuadros"></div>
    <div class="latido" id="latido"></div>
    <div class="blanco"></div>
  </div></div>
  <p class="cartel arriba">Tenés una invitación muy especial</p>
  <p class="cartel abajo" id="pista">Tocá para abrir</p>
  <button id="abrir" aria-label="Abrir la invitación"></button>
</div>

<main id="principal"></main>
<div id="petalos" aria-hidden="true"></div>

<button class="flotante" id="musica" hidden aria-label="Pausar o seguir la música">

function contenido(tipo,o){
  const K=(k,c,tag="span")=>`<${tag} class="${c}" data-k="${k}"></${tag}>`;
  const boton=(clase,html)=>o.b?"":`<a class="boton ${clase}" target="_blank" rel="noopener">${html}</a>`;
  switch(tipo){
    case "nombres": return K("eti","eti")+K("novia","nombre")+`<span class="y">&amp;</span>`+K("novio","nombre")+`<span class="linea"></span>`+K("fecha_una","fecha");
    case "frase": return SVG.corazon+K("frase","frase")+`<span class="linea"></span>`;
    case "padres": return K("titulo_padres","chico")+`<span class="linea"></span><span class="rotulo">Padres de la novia</span>`+K("padres_novia","grande")+
      `<span class="rotulo">Padres del novio</span>`+K("padres_novio","grande");
    case "fecha": return (o.L?"":`<span class="titulo">Guardá esta fecha</span>`)+`<span class="eti" data-k="mes_anio"></span><div class="cal" data-cal></div>`+K("hora_ceremonia","rotulo");
    case "cuenta": return `<span class="titulo">Faltan</span>`+(o.k||o.kf?"":`<div class="fila">${["d|días","h|horas","m|min","s|seg"].map(x=>{const[a,b]=x.split("|");return `<div><b class="num" data-c="${a}"></b><span class="uni">${b}</span></div>`}).join("")}</div>`)+K("fecha_una","fecha");
    case "ceremonia": return SVG.anillos+`<span class="titulo">Ceremonia</span>`+(o.L?`<span class="fecha" data-t="{fecha_una}"></span>`:K("lugar_ceremonia","grande")+K("direccion_ceremonia","chico")+`<span class="rotulo" data-t="{hora_ceremonia} hs"></span>`+boton("mapa-c",SVG.mapa+"Cómo llegar"));
    case "fiesta": return SVG.copas+`<span class="titulo">Fiesta</span>`+K("salon","grande")+K("direccion","chico")+`<span class="rotulo" data-t="{hora_fiesta} hs"></span>`+boton("mapa",SVG.mapa+"Cómo llegar");
    case "cronograma": return `<span class="titulo">El gran día</span><div class="agenda" data-agenda></div>`;
    case "vestimenta": return `<span class="rotulo">Código de vestimenta</span>`+K("vestimenta","titulo")+`<span class="linea"></span>`+K("vestimenta_texto","chico");
    case "regalo": if(o.soloTit) return SVG.regalo+`<span class="titulo">Regalos</span>`;
      return (o.sinTit?"":(o.corto?"":SVG.regalo)+`<span class="titulo">Regalos</span>`)+(o.corto?"":K("regalo_texto","chico"))+
      `<span class="rotulo" data-t="{banco}"></span><span class="dato" data-t="CBU {cbu}"></span>`+(o.sinAlias?"":`<span class="dato" data-t="Alias {alias}"></span>`)+(o.b?"":`<button class="boton copiar">${SVG.copia}Copiar alias</button>`);
    case "confirmar": return (o.sinTit?"":`<span class="titulo">Sólo faltás vos</span>`)+`<span class="nombre" style="font-size:calc(9cqw*var(--e))">¿Venís?</span>`+K("confirmar_texto","chico")+boton("wa",SVG.wa+"Confirmar");
    case "final": return K("final_texto","titulo")+K("novia","nombre")+`<span class="y">&amp;</span>`+K("novio","nombre")+K("fecha_corta","fecha");
  }
  return "";
}

function campo(k,l,tipo){
  const lab=document.createElement("label"); lab.textContent=l; let inp;
  if(tipo==="melodia"){ inp=document.createElement("select"); MELODIAS.forEach(([v,t])=>inp.add(new Option(t,v)));
    inp.addEventListener("change",()=>{ audio.src=inp.value; audio.play().then(()=>{btnM.hidden=false;btnM.classList.add("sonando");}).catch(()=>{}); }); }
  else { inp=document.createElement(tipo==="area"?"textarea":"input");
    if(tipo==="audio"){ inp.type="file"; inp.accept="audio/*"; inp.addEventListener("change",e=>{ const f=e.target.files[0]; if(!f) return; if(f.size>15e6){ aviso("Esa canción es muy pesada: elegí una de menos de 15 MB"); inp.value=""; return; }
      const loc=URL.createObjectURL(f); audio.src=loc; cancion=null; audio.play().then(()=>{btnM.hidden=false;btnM.classList.add("sonando");}).catch(()=>{}); aviso("Guardando tu canción…");
      subiendo.c=subirCancion(f).then(u=>{ if(audio.src===loc) cancion=u; aviso("Canción guardada"); })
        .catch(()=>aviso("No se pudo guardar la canción. Probá de nuevo con buena señal")).finally(()=>delete subiendo.c); }); }
    else if(tipo==="file"){ inp.type="file"; inp.id="fi"+(k==="foto1"?1:2); inp.accept="image/*"; inp.addEventListener("change",e=>{ const f=e.target.files[0]; if(!f) return; const n=k==="foto1"?1:2, loc=URL.createObjectURL(f); fotos[n]=loc; $("#aj"+n).classList.add("si"); ponerFotos();
      subiendo[n]=subirFoto(n,f).then(u=>{ if(fotos[n]===loc){ fotos[n]=u; const im=new Image(); im.src=u; } aviso("Foto guardada. Si no quedó bien, acomodala con las barritas"); })
        .catch(()=>aviso("No se pudo guardar la foto en internet. Probá de nuevo con buena señal")).finally(()=>delete subiendo[n]); }); }
    else { inp.type=tipo||"text"; if(tipo!=="area") inp.type=tipo||"text"; inp.value=datos[k]; inp.addEventListener("input",()=>{ datos[k]=inp.value; aplicar(); }); } }
  lab.append(inp); return lab;
}

      im.onload=()=>{ const r=im.naturalWidth/im.naturalHeight, A=768/1376, [zl,zt,zr,zb]=box.dataset.z.split(",").map(Number), W=zr-zl, H=zb-zt; let w=W, h=W*A/r;
        if(h>H){ h=H; w=H*r/A; }
        box.setAttribute("style",`left:${zl+(W-w)/2}%;top:${zt+(H-h)/2}%;width:${w}%;height:${h}%`); ponerFotos.vars(box); }; } }); }
Object.entries(DIS).forEach(([id,D])=>{ const b=document.createElement("button"); b.dataset.d=id; b.innerHTML=`<img src="${IMG(D.tapa[0])}" alt="" loading="lazy">${D.nombre}`; b.addEventListener("click",()=>diseno(id)); $("#disenos").append(b); });

/* ---- diseño elegido ---- */
function diseno(id){
  actual=id; const D=DIS[id], r=document.documentElement.style;
  Object.entries({fondo:"--fondo",tinta:"--tinta",oro:"--oro",suave:"--suave",boton:"--boton",bt:"--boton-txt"}).forEach(([k,v])=>r.setProperty(v,D.tema[k]));
  r.setProperty("--script",D.script||"'Pinyon Script',cursive");
  document.body.classList.toggle("oscuro",!!D.oscuro);
  $("#cuadros").replaceChildren(...D.tapa.map(n=>{ const im=new Image(); im.className="cuadro"; im.alt=""; im.src=IMG(n); return im; }));
  $("#latido").style.top=D.luz; $("#pista").textContent=D.pista;
  $$("#disenos button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.d===id));
  reiniciarPortada(); render(id);
  history.replaceState(null,"",location.pathname+location.search+"#"+id);
}

/* ---- aparición de cada pantalla ---- */
let io;
function observar(){
  io?.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.remove("oculto"); e.target.classList.add("visto"); io.unobserve(e.target);} }),{threshold:.22});
  $$(".reveal.oculto").forEach(s=>io.observe(s));
}

/* ---- mariposas que cruzan volando (dibujadas, colores del diseño) ---- */
const MARI_SVG='<svg viewBox="-12 -11 24 22" aria-hidden="true"><g fill="var(--m1)" opacity=".92"><path d="M0-1C-3-8-11-11-11-4-11 1-5 1 0 0Z"/><path d="M0-1C3-8 11-11 11-4 11 1 5 1 0 0Z"/></g><g fill="var(--m2)" opacity=".92"><path d="M0 0C-2 4-8 10-9 5-10 2-5 0 0 0Z"/><path d="M0 0C2 4 8 10 9 5 10 2 5 0 0 0Z"/></g><path d="M0-5V6M0-5l-2-4M0-5l2-4" stroke="var(--m3)" stroke-width=".9" fill="none" stroke-linecap="round"/></svg>';
function volar(){
  const c=DIS[actual].mari||["#f6dfae","#e8c57f","#7a5a2a"];
  $$(".lienzo.visto").forEach(s=>{
    const r=s.getBoundingClientRect(); if(r.bottom<0||r.top>innerHeight||document.hidden) return;
    if(s.querySelectorAll(".vuela").length>1||Math.random()<.45) return;
    const v=document.createElement("span"), izq=Math.random()<.5, t=18+Math.random()*6;
    v.className="vuela"+(izq?" izq":""); v.innerHTML=MARI_SVG;
    v.style.cssText=`top:${12+Math.random()*70}%;--t:${t}s;--g:${izq?-78:78}deg;--m1:${c[0]};--m2:${c[1]};--m3:${c[2]};width:${5+Math.random()*3}cqw`;
    s.append(v); setTimeout(()=>v.remove(),t*1000+200);
  });
}
setInterval(volar,4500);

/* ---- pétalos ---- */
let petalosOn=false;
function petalo(){
  if(!petalosOn||document.hidden) return;
  const p=document.createElement("span"); p.className="petalo"; const c=DIS[actual].petalos, R=()=>c[Math.floor(Math.random()*c.length)];
  const t=8+Math.random()*10, s=9+Math.random()*12;
  p.style.cssText=`left:${Math.random()*100}vw;width:${s}px;height:${s*.8}px;--v:${(Math.random()*60-30).toFixed(0)}px;animation-duration:${t}s;background:linear-gradient(135deg,${R()},${R()});box-shadow:inset -1px -1px 2px rgba(0,0,0,.06)`;
  $("#petalos").append(p); setTimeout(()=>p.remove(),t*1000);
}
setInterval(petalo,700);

/* ---- abrir ---- */
const audio=$("#audio"), btnM=$("#musica"), port=$("#portada");
function reiniciarPortada(){ (abrir.ts||[]).forEach(clearTimeout); port.hidden=false; port.className=""; document.body.classList.add("cerrado"); $$("#cuadros img").forEach((im,i)=>im.classList.toggle("ver",i===0)); }
function abrir(){
  if(port.classList.contains("abriendo")){ cerrarPortada(); return; }
  port.classList.add("abriendo"); audio.volume=.75; audio.play().then(()=>btnM.classList.add("sonando")).catch(()=>{});
  btnM.hidden=false; petalosOn=true; for(let i=0;i<12;i++) setTimeout(petalo,i*110);
  const ims=$$("#cuadros img"); abrir.ts=[]; destello();
  if(ims.length>1){ ims.forEach((im,i)=>{ if(i>0) abrir.ts.push(setTimeout(()=>{ im.classList.add("ver"); destello(); },400+(i-1)*1300)); }); }
  const fin=ims.length>1?400+(ims.length-1)*1300:300;
  abrir.ts.push(setTimeout(()=>{ port.classList.add("zoom"); destello(); },fin));
  abrir.ts.push(setTimeout(()=>port.classList.add("final"),fin+1900));
  abrir.ts.push(setTimeout(cerrarPortada,fin+2900));
}
function destello(){ const f=document.createElement("div"); f.className="destello"; f.style.top=DIS[actual].luz; $("#escena").append(f); setTimeout(()=>f.remove(),1700); }
function cerrarPortada(){ (abrir.ts||[]).forEach(clearTimeout); port.classList.add("final","fuera"); document.body.classList.remove("cerrado"); if(!invitado) $("#editar").hidden=false; window.scrollTo(0,0); setTimeout(()=>port.hidden=true,1300); }
$("#abrir").addEventListener("click",abrir);
$("#repetir").addEventListener("click",()=>{ $("#hoja").classList.remove("abierta"); window.scrollTo(0,0); reiniciarPortada(); render(actual); });
btnM.addEventListener("click",()=>{ if(audio.paused){audio.play();btnM.classList.add("sonando");} else {audio.pause();btnM.classList.remove("sonando");} });
$("#editar").addEventListener("click",()=>$("#hoja").classList.add("abierta"));
$("#listo").addEventListener("click",()=>$("#hoja").classList.remove("abierta"));

function aviso(t){ const a=$("#aviso"); a.textContent=t; a.classList.add("ver"); setTimeout(()=>a.classList.remove("ver"),1900); }
async function copiarAlias(){ try{ await navigator.clipboard.writeText(datos.alias); aviso("Alias copiado: "+datos.alias); }catch{ aviso("Alias: "+datos.alias); } }

function cuenta(){
  const obj=new Date(`${datos.fecha}T${datos.hora_ceremonia||"00:00"}:00-03:00`); let r=Math.max(0,obj-Date.now())/1000;
  const v={d:Math.floor(r/86400),h:Math.floor(r%86400/3600),m:Math.floor(r%3600/60),s:Math.floor(r%60)};
  $$("[data-c]").forEach(b=>b.textContent=v[b.dataset.c]);
}
setInterval(cuenta,1000);



/* ---- fotos a la nube (Cloudinary de Fabiana: solo nombre público + preset sin firma) ---- */
const NUBE={nombre:"xpaichd1",preset:"invitaciones"}, subiendo={}; let cancion=null;
async function subirCancion(f){ const fd=new FormData(); fd.append("file",f); fd.append("upload_preset",NUBE.preset);
  const r=await fetch(`https://api.cloudinary.com/v1_1/${NUBE.nombre}/video/upload`,{method:"POST",body:fd});
  if(!r.ok) throw new Error("subida "+r.status); return (await r.json()).secure_url; }
function achicar(f,max=1400){ return new Promise((ok,mal)=>{ const im=new Image(); im.onload=()=>{
  const k=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement("canvas");
  c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  c.toBlob(b=>b?ok(b):mal(new Error("no se pudo achicar")),"image/jpeg",.82); }; im.onerror=mal; im.src=URL.createObjectURL(f); }); }
async function subirFoto(n,f){
  aviso("Guardando tu foto…");
  const fd=new FormData(); fd.append("file",await achicar(f)); fd.append("upload_preset",NUBE.preset);
  const r=await fetch(`https://api.cloudinary.com/v1_1/${NUBE.nombre}/image/upload`,{method:"POST",body:fd});
  if(!r.ok) throw new Error("subida "+r.status);
  const j=await r.json(); return j.secure_url.replace("/upload/","/upload/f_auto,q_auto/");
}

/* ---- compartir: los datos viajan comprimidos dentro del link ---- */
const ORIG=JSON.parse(JSON.stringify(datos)); let invitado=false;
async function empacar(o){ const st=new Blob([JSON.stringify(o)]).stream().pipeThrough(new CompressionStream("deflate-raw"));
  const b=new Uint8Array(await new Response(st).arrayBuffer()); let t=""; b.forEach(x=>t+=String.fromCharCode(x));
  return btoa(t).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
async function desempacar(c){ const t=atob(c.replace(/-/g,"+").replace(/_/g,"/")), b=Uint8Array.from(t,x=>x.charCodeAt(0));
  const st=new Blob([b]).stream().pipeThrough(new DecompressionStream("deflate-raw")); return JSON.parse(await new Response(st).text()); }
async function miLink(){
  const o={d:actual,t:{}}; Object.keys(datos).forEach(k=>{ if(datos[k]!==ORIG[k]) o.t[k]=datos[k]; });
  const m=MELODIAS.find(([v])=>audio.src.endsWith(v)); if(m) o.m=m[0]; else if(cancion&&audio.src.startsWith("blob:")) o.m=cancion; else if(/^https:\/\/res\.cloudinary/.test(audio.src)) o.m=audio.src;
  [1,2].forEach(n=>{ if(fotos[n]&&/^https:/.test(fotos[n])) (o.f=o.f||{})[n]=fotos[n]; });
  o.a=aj; return location.origin+location.pathname+"#i="+await empacar(o);
}
$("#compartir").addEventListener("click",async()=>{
  if(Object.keys(subiendo).length){ aviso("Esperá un segundito, se está guardando tu foto…"); await Promise.allSettled(Object.values(subiendo)); }
  const url=await miLink(), local=[1,2].some(n=>fotos[n]&&!/^https:/.test(fotos[n]));
  if(local){ aviso("Tu foto no se pudo guardar: volvé a subirla con buena señal antes de compartir"); return; }
  if(audio.src.startsWith("blob:")&&!cancion){ aviso("Tu canción no se pudo guardar: volvé a subirla con buena señal antes de compartir"); return; }
  const txt=`${datos.novia} & ${datos.novio} · ¡Estás invitado a nuestro casamiento!`;
  if(navigator.share){ try{ await navigator.share({title:txt,text:txt,url}); return; }catch(e){ if(e.name==="AbortError") return; } }
  try{ await navigator.clipboard.writeText(url); aviso("Link copiado: pegalo en WhatsApp"); }catch(e){ prompt("Copiá tu link:",url); }
});

/* arranque: #salvia, #bordo... ; "-abierta" salta la portada (para revisar); "#i=..." es la invitación de una novia */
const h=location.hash.slice(1), id=h.split("-")[0];
if(h.startsWith("i=")){ invitado=true; document.body.classList.add("invitado");
  desempacar(h.slice(2)).then(o=>{ Object.assign(datos,o.t||{}); if(o.m) audio.src=o.m;
    if(o.a) Object.assign(aj,o.a); if(o.f) Object.assign(fotos,o.f); diseno(DIS[o.d]?o.d:"marfil"); ponerFotos(); aplicar(); })
  .catch(()=>diseno("marfil")); }
else diseno(DIS[id]?id:"marfil");
if(h.includes("abierta")){ port.hidden=true; document.body.classList.remove("cerrado"); $$(".reveal").forEach(s=>s.classList.remove("oculto")); $$(".reveal").forEach(s=>s.classList.add("visto")); setTimeout(ajustar,300); }
</script>
